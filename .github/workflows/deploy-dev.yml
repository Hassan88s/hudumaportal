name: Deploy to Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP → dev.hudumaportal.co.tz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          protocol: ${{ secrets.SFTP_PROTOCOL }}   # set secret to "ftp" or "ftps"
          security: loose
          server-dir: ${{ secrets.SFTP_DEV_PATH }}
          state-name: .ftp-deploy-sync-state.json  # incremental — only uploads changed files
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/@core/vendor/**
            **/@core/storage/framework/cache/**
            **/@core/storage/framework/views/**
            **/@core/storage/framework/sessions/**
            **/@core/storage/logs/**
            **/@core/storage/app/public/**
            **/@core/bootstrap/cache/*.php
            **/@core/.env
            **/@core/.env.*
            **/assets/uploads/**
            **/backups/**
            **/security/**
            **/*.sql
            **/*.zip
            **/*.tar.gz
            **/error_log
            index.php
            .htaccess
            .user.ini
            @core/app/Providers/AppServiceProvider.php

      - name: Clear Laravel caches
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/hudumaportalco/dev.hudumaportal.co.tz/@core
            /opt/cpanel/ea-php81/root/usr/bin/php artisan cache:clear
            /opt/cpanel/ea-php81/root/usr/bin/php artisan config:clear
            /opt/cpanel/ea-php81/root/usr/bin/php artisan view:clear
            /opt/cpanel/ea-php81/root/usr/bin/php artisan route:clear
