name: Deploy to Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: SFTP → dev.hudumaportal.co.tz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Stage a clean copy of only-what-we-want-to-deploy into ./_deploy
      # This lets us use exclude patterns even though wlixcc/SFTP-Deploy-Action
      # doesn't support them natively.
      - name: Build clean deploy folder
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='_deploy/' \
            --exclude='@core/vendor/' \
            --exclude='@core/storage/framework/cache/' \
            --exclude='@core/storage/framework/views/' \
            --exclude='@core/storage/framework/sessions/' \
            --exclude='@core/storage/logs/' \
            --exclude='@core/storage/app/public/' \
            --exclude='@core/bootstrap/cache/*.php' \
            --exclude='@core/.env' \
            --exclude='@core/.env.*' \
            --exclude='assets/uploads/' \
            --exclude='backups/' \
            --exclude='security/' \
            --exclude='*.sql' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            --exclude='error_log' \
            --exclude='index.php' \
            --exclude='.htaccess' \
            --exclude='.user.ini' \
            --exclude='@core/app/Providers/AppServiceProvider.php' \
            ./ _deploy/
          echo "Files staged for upload:"
          find _deploy -type f | wc -l

      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './_deploy/*'
          remote_path: ${{ secrets.SFTP_DEV_PATH }}
          sftp_only: true
          delete_remote_files: false

      # Note: Laravel cache-clear moved OUT of the workflow because our
      # dedicated FTP account has no SSH shell access.
      # To clear caches when needed, run manually via cPanel Terminal:
      #   cd /home/hudumaportalco/dev.hudumaportal.co.tz/@core
      #   php artisan cache:clear && php artisan view:clear && php artisan config:clear && php artisan route:clear
