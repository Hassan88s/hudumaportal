name: Deploy to Dev

# Triggers: every push to main, plus manual "Run workflow" from GitHub UI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: SFTP → dev.hudumaportal.co.tz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Upload everything (except excluded paths) via SFTP over SSH (port 22)
      - name: Upload files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: ${{ secrets.SFTP_DEV_PATH }}
          delete_remote_files: false        # never delete anything on the server
          sftp_only: true                    # force SFTP (not SCP)
          # Files/paths that must NEVER be uploaded (env-specific / generated / user data)
          exclude: |
            .git
            .github
            @core/vendor
            @core/storage/framework/cache
            @core/storage/framework/views
            @core/storage/framework/sessions
            @core/storage/logs
            @core/storage/app/public
            @core/bootstrap/cache
            @core/.env
            @core/.env.local
            @core/.env.production
            assets/uploads
            backups
            security
            index.php
            .htaccess
            .user.ini
            @core/app/Providers/AppServiceProvider.php

      # Clear Laravel caches on the server after upload
      - name: Clear Laravel caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            cd /home/hudumaportalco/dev.hudumaportal.co.tz/@core
            /opt/cpanel/ea-php81/root/usr/bin/php artisan cache:clear
            /opt/cpanel/ea-php81/root/usr/bin/php artisan config:clear
            /opt/cpanel/ea-php81/root/usr/bin/php artisan view:clear
            /opt/cpanel/ea-php81/root/usr/bin/php artisan route:clear
