name: Deploy to Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: FTPS → dev.hudumaportal.co.tz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # full history for incremental deploy diff

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftp                      # plain FTP: FTPS on cPanel has a Node library incompat (SSL alert 50)
          server-dir: /                      # jailed FTP user sees dev subdomain as /
          state-name: .ftp-deploy-sync-state.json   # incremental: uploads only changed files
          timeout: 60000                     # 60s per operation
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/@core/vendor/**
            **/@core/storage/framework/cache/**
            **/@core/storage/framework/views/**
            **/@core/storage/framework/sessions/**
            **/@core/storage/logs/**
            **/@core/storage/app/public/**
            **/@core/bootstrap/cache/*.php
            **/@core/.env
            **/@core/.env.*
            **/assets/uploads/**
            **/backups/**
            **/security/**
            **/*.sql
            **/*.zip
            **/*.tar.gz
            **/error_log
            **/_deploy/**
            index.php
            .htaccess
            .user.ini
            @core/app/Providers/AppServiceProvider.php
